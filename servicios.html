<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicios - Panagreen - Ingeniería y consultoría ambiental</title>
    <link href="imagenes/logo.png" rel="shortcut icon" type="image/x-icon">

    <!-- Bootstrap 5.3.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons y FontAwesome (Mismos que nosotros.html) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.4/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- CSS EXTERNO (Reutilizando index y creando servicios.css) -->
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/servicios.css">
</head>

<body>

    <!-- Placeholder para Navegación -->
    <div id="nav-placeholder"></div>

    <main>
        <!-- Banner Superior (Siguiendo el patrón de nosotros.html) -->
        <header class="servicios-header py-4">
            <div class="container text-center">
                <h1 class="text-uppercase fw-bold m-0 text-white">Servicios</h1>
            </div>
        </header>

        <!-- Sección Principal: Galería de Servicios (Estructura de la imagen) -->
        <section class="py-5 bg-white">
            <div class="container">
                <div class="row g-4 text-center justify-content-center">
                    <!-- Col-12 (móvil), Col-sm-6 (tablet), Col-md-4 (PC) -->
                    <!-- Servicio 1: Consultoría Ambiental -->
                    <div class="col-12 col-sm-6 col-md-4">
                        <div class="servicio-card border-0">
                            <!-- Clase img-fluid de Bootstrap para que sea 100% responsiva -->
                            <img src="imagenes/consultoria-ambiental-2.png" class="img-fluid rounded"
                                alt="Consultoría Ambiental">
                            <h3 class="servicio-titulo text-center">Consultoría Ambiental</h3>
                        </div>
                    </div>

                    <!-- Servicio 2: Servicios de Ingeniería -->
                    <div class="col-12 col-sm-6 col-md-4">
                        <div class="servicio-card border-0">
                            <img src="imagenes/servicios-ingenieria-2.png" alt="Servicios de Ingeniería"
                                class="img-fluid mb-2 rounded">
                            <h3 class="servicio-titulo text-center">Servicios de Ingeniería</h3>
                        </div>
                    </div>

                    <!-- Servicio 3: Permisos Ambientales -->
                    <div class="col-12 col-sm-6 col-md-4">
                        <div class="servicio-card border-0">
                            <img src="imagenes/permisos-ambientales-2.png" alt="Permisos Ambientales"
                                class="img-fluid mb-2 rounded">
                            <h3 class="servicio-titulo text-center">Permisos Ambientales</h3>
                        </div>
                    </div>

                    <!-- Servicio 4: Estudios Sociales (Segunda Fila) -->
                    <div class="col-12 col-sm-6 col-md-4">
                        <div class="servicio-card border-0">
                            <img src="imagenes/estudios-sociales.png" alt="Estudios Sociales"
                                class="img-fluid mb-2 rounded">
                            <h3 class="servicio-titulo text-center">Estudios Sociales</h3>
                        </div>
                    </div>

                    <!-- Servicio 5: Monitoreo Ambiental -->
                    <div class="col-12 col-sm-6 col-md-4">
                        <div class="servicio-card border-0">
                            <img src="imagenes/monitoreo-ambiental-2.png" alt="Monitoreo Ambiental"
                                class="img-fluid mb-2 rounded">
                            <h3 class="servicio-titulo text-center">Monitoreo Ambiental</h3>
                        </div>
                    </div>

                </div>
            </div>
        </section>

        <!-- Llamada a la Acción Final (Mismo patrón que nosotros.html) -->
        <section class="bg-light py-5 border-top CTA-final">
            <div class="container text-center">
                <h2 class="CTA-titulo fw-bold">¿Tiene alguna pregunta? Te ayudaremos.</h2>
                <p class="text-muted mb-4">Contamos con el respaldo de profesionales con experiencia en entidades
                    públicas y privadas.</p>
                <a href="contacto.html"
                    class="btn btn-contacto text-white px-5 py-3 fw-bold text-uppercase">Contáctanos</a>
            </div>
        </section>
    </main>

    <!-- Placeholder para Footer -->
    <div id="footer-placeholder"></div>

    <!-- Bootstrap 5.3.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // CARGA DE COMPONENTES (Mismo script que nosotros.html)
        document.addEventListener("DOMContentLoaded", function () {
            // Cargar Nav
            fetch('componentes/navbar.html')
                .then(res => res.text())
                .then(data => {
                    document.getElementById('nav-placeholder').innerHTML = data;
                    resaltarLink(); // Ejecutar resaltado tras cargar
                });

            // Cargar Footer
            fetch('componentes/footer.html')
                .then(res => res.text())
                .then(data => {
                    document.getElementById('footer-placeholder').innerHTML = data;
                });
        });

        // Lógica de resaltado (Verde Panagreen)
        function resaltarLink() {
            const path = window.location.pathname.split("/").pop() || "index.html";
            const links = document.querySelectorAll('.nav-link');
            links.forEach(link => {
                if (link.getAttribute('href') === path) {
                    link.classList.add('active');
                }
            });
        }
    </script>

</body>

</html>
