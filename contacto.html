<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Panagreen - Ingeniería y consultoría ambiental</title>
    <link href="imagenes/logo.png" rel="shortcut icon" type="image/x-icon">

    <!-- Bootstrap 5.3.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons y FontAwesome -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.4/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- CSS EXTERNO -->
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/contacto.css">
</head>

<body>

    <div id="nav-placeholder"></div>

    <main>
        <!-- Banner Superior (Patrón Institucional idéntico a galería) -->
        <header class="galeria-header py-4">
            <div class="container text-center">
                <h1 class="text-uppercase fw-bold m-0 text-white">Contacto</h1>
            </div>
        </header>

        <!-- Sección de Contenido -->
        <section class="py-5 bg-white">
            <div class="container">
                <div class="row g-5">

                    <!-- Columna Mapa -->
                    <div class="col-12 col-lg-6">
                        <h2 class="h4 fw-bold mb-4 text-azul-panagreen border-start border-4 border-success ps-3">Mapa
                            de ubicación</h2>
                        <div class="mapa-contenedor shadow-sm rounded overflow-hidden"
                            style="height: 400px; border: 1px solid #eee;">
                            <iframe
                                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3903.1118126154673!2d-77.126588!3d-11.838536!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x9105d15c7e3f899d%3A0x6b4a2e2f6027376!2sMi%20Per%C3%BA%2C%20Callao!5e0!3m2!1ses!2spe!4v1714850000000!5m2!1ses!2spe"
                                width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy">
                            </iframe>
                        </div>
                        <div class="mt-3 d-flex align-items-start">
                            <i class="bi bi-geo-alt-fill text-success me-2 mt-1"></i>
                            <p class="text-muted mb-0">Calle Ventanilla Mz “J” Lote 10 Mi Perú - Callao, Perú</p>
                        </div>
                    </div>

                    <!-- Columna Formulario -->
                    <div class="col-12 col-lg-6">
                        <h2 class="h4 fw-bold mb-4 text-azul-panagreen border-start border-4 border-success ps-3">
                            Formulario de Contacto</h2>
                        <!-- Formulario actualizado para PHP -->
                        <form action="enviar_contacto.php" method="POST" class="row g-3">
                            <div class="col-12">
                                <label class="form-label fw-semibold">Nombre (*)</label>
                                <input type="text" name="nombre" class="form-control" required
                                    placeholder="Tu nombre completo">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Email (*)</label>
                                <input type="email" name="email" class="form-control" required
                                    placeholder="correo@ejemplo.com">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Celular (*)</label>
                                <input type="tel" name="celular" class="form-control" required
                                    placeholder="Ej: 999 999 999">
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-semibold">Mensaje (*)</label>
                                <textarea name="mensaje" class="form-control" rows="4" required
                                    placeholder="¿En qué podemos ayudarte?"></textarea>
                            </div>
                            <div class="col-12">
                                <button type="submit"
                                    class="btn btn-azul-panagreen w-100 py-2 fw-bold text-uppercase">Enviar
                                    Mensaje</button>
                            </div>
                        </form>
                    </div>

                </div>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <!-- Bootstrap 5.3.3 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // Cargar Nav
            fetch('componentes/navbar.html')
                .then(res => res.text())
                .then(data => {
                    document.getElementById('nav-placeholder').innerHTML = data;
                });

            // Cargar Footer
            fetch('componentes/footer.html')
                .then(res => res.text())
                .then(data => {
                    document.getElementById('footer-placeholder').innerHTML = data;
                });
        });
    </script>

</body>

</html>
